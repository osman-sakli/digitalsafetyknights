<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Build Your Safe Profile — sort what's ok to share online vs what should stay private.">
<title>Build Your Safe Profile — Digital Safety Knights</title>
<link rel="canonical" href="https://digitalsafetyknights.org/safe-profile-builder.html">
<meta property="og:title" content="Build Your Safe Profile — Digital Safety Knights">
<meta property="og:description" content="Build Your Safe Profile — sort what's ok to share online vs what should stay private.">
<meta property="og:image" content="https://digitalsafetyknights.org/assets/logo.png">
<meta property="og:url" content="https://digitalsafetyknights.org/safe-profile-builder.html">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.ico">
<script src="assets/knight-points.js"></script>
<script src="/assets/i18n.js"></script>
<style>
  :root { --navy: #0d1b3e; --navy2: #1a2f6e; --gold: #c9a84c; --gold2: #e8c56a; --light: #f4f6fb; --gray: #6c757d; --success: #2a9d8f; --danger: #e63946; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif; background: var(--light); color: #2d3748; }
  .topbar { background: var(--navy); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 20px rgba(0,0,0,0.3); }
  .topbar .brand { color: var(--gold); font-weight: 900; text-decoration: none; font-size: 1.05rem; }
  .topbar .home-link { color: #cdd6ea; text-decoration: none; font-size: 0.85rem; font-weight: 700; }
  .wrap { max-width: 620px; margin: 0 auto; padding: 30px 18px 80px; }
  .hero { text-align: center; margin-bottom: 20px; }
  .hero .icon { font-size: 2.6rem; margin-bottom: 6px; }
  .hero h1 { color: var(--navy); font-size: 1.5rem; margin-bottom: 6px; }
  .hero p { color: var(--gray); font-size: 0.88rem; }

  .tray { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; min-height: 44px; }
  .item-chip { background: white; border: 2px solid var(--navy); border-radius: 20px; padding: 9px 16px; font-weight: 700; font-size: 0.85rem; cursor: pointer; box-shadow: 0 2px 12px rgba(13,27,62,0.08); }
  .item-chip.selected { background: var(--gold); border-color: var(--gold); }

  .buckets { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .bucket { border-radius: 16px; padding: 14px; min-height: 200px; }
  .bucket.share { background: rgba(42,157,143,0.08); border: 2px dashed var(--success); }
  .bucket.private { background: rgba(230,57,70,0.06); border: 2px dashed var(--danger); }
  .bucket-title { font-weight: 900; font-size: 0.85rem; margin-bottom: 10px; text-align: center; }
  .bucket.share .bucket-title { color: var(--success); }
  .bucket.private .bucket-title { color: var(--danger); }
  .placed-chip { background: white; border-radius: 10px; padding: 8px 10px; font-size: 0.8rem; font-weight: 700; margin-bottom: 6px; text-align: center; }
  .placed-chip.correct { border-left: 4px solid var(--success); }
  .placed-chip.wrong { border-left: 4px solid var(--danger); }
  .placed-explain { font-size: 0.72rem; color: var(--gray); font-weight: 400; margin-top: 2px; }

  .score-band { margin-top: 18px; background: white; border-radius: 16px; padding: 14px 18px; text-align: center; box-shadow: 0 2px 20px rgba(13,27,62,0.07); }
  .score-num { font-size: 1.6rem; font-weight: 900; color: var(--navy); }
  .reset-btn { display: block; margin: 14px auto 0; background: var(--gold); color: var(--navy); border: none; padding: 11px 24px; border-radius: 20px; font-weight: 900; cursor: pointer; }
</style>
<link rel="stylesheet" href="assets/breadcrumb.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>

<div class="topbar">
  <a class="brand" href="/">🛡️ Digital Safety Knights</a>
  <a class="home-link" href="/resources.html" data-i18n="fc.backResources">← Resource Center</a>
</div>
<div class="dsk-breadcrumb"><a href="/" data-i18n="qp.home2">Home</a><span class="sep">/</span><a href="/resources.html" data-i18n="nav.resources2">Resources</a><span class="sep">/</span><span class="current" data-i18n="spb.title">Build Your Safe Profile</span></div>

<div class="wrap">
  <div class="hero">
    <div class="icon">🗂️</div>
    <h1 data-i18n="spb.title">Build Your Safe Profile</h1>
    <p data-i18n="spb.subtitle">Tap an item, then tap the bucket where you think it belongs.</p>
  </div>

  <div class="tray" id="tray"></div>

  <div class="buckets">
    <div class="bucket share" onclick="place('share')">
      <div class="bucket-title" data-i18n="spb.okShare">✅ OK to Share</div>
      <div id="share-list"></div>
    </div>
    <div class="bucket private" onclick="place('private')">
      <div class="bucket-title" data-i18n="spb.keepPrivate">🔒 Keep Private</div>
      <div id="private-list"></div>
    </div>
  </div>

  <div class="score-band">
    <div class="score-num" id="score-num">0 / 0 sorted</div>
    <button class="reset-btn" onclick="resetGame()" data-i18n="spb.reset">🔁 Reset</button>
  </div>
</div>

<script>
var spbLang = (window.DSKi18n && DSKi18n.lang) || 'en';
var spbIsTr = spbLang === 'tr';
var spbIsEs = spbLang === 'es';
var ITEMS_EN = [
  { text: 'Nickname or gamer tag', correct: 'share', explain: "A made-up nickname doesn't reveal who you really are." },
  { text: 'Favorite game or hobby', correct: 'share', explain: 'Interests are totally safe to share — that\'s how you find friends with things in common.' },
  { text: 'Cartoon avatar picture', correct: 'share', explain: 'A drawn avatar shows personality without revealing your real face.' },
  { text: 'Your team\'s win/loss record', correct: 'share', explain: 'General game stats don\'t identify you personally.' },
  { text: 'Full real name', correct: 'private', explain: 'Your real name is one of the easiest ways to be identified and searched.' },
  { text: 'School name', correct: 'private', explain: 'This tells a stranger exactly where to find you in person.' },
  { text: 'Home address', correct: 'private', explain: 'This is the single most sensitive piece of information — never share it online.' },
  { text: 'A clear photo of your face', correct: 'private', explain: 'Real photos can be searched, saved, and used without your permission.' },
  { text: 'Daily schedule (e.g. "practice every Tuesday")', correct: 'private', explain: 'Routines tell someone exactly when and where to find you.' },
  { text: 'Phone number', correct: 'private', explain: 'A phone number can be used to contact, track down, or impersonate you.' },
  { text: 'Exact birthdate', correct: 'private', explain: 'Combined with your name, this is often enough to steal an identity.' },
  { text: 'Parent\'s full name and workplace', correct: 'private', explain: 'This can be used to locate or impersonate your family.' }
];

var ITEMS_TR = [
  { text: 'Lakap veya oyuncu adı', correct: 'share', explain: 'Uydurma bir lakap gerçekte kim olduğunu ortaya çıkarmaz.' },
  { text: 'Favori oyun veya hobi', correct: 'share', explain: 'İlgi alanlarını paylaşmak tamamen güvenlidir — ortak şeyleri olan arkadaşları böyle bulursun.' },
  { text: 'Çizgi film avatar resmi', correct: 'share', explain: 'Çizilmiş bir avatar, gerçek yüzünü ortaya çıkarmadan kişiliğini gösterir.' },
  { text: 'Takımının galibiyet/mağlubiyet skoru', correct: 'share', explain: 'Genel oyun istatistikleri seni kişisel olarak tanımlamaz.' },
  { text: 'Tam gerçek adın', correct: 'private', explain: 'Gerçek adın, tanımlanmanın ve aranmanın en kolay yollarından biridir.' },
  { text: 'Okul adı', correct: 'private', explain: 'Bu, bir yabancıya seni gerçek hayatta tam olarak nerede bulacağını söyler.' },
  { text: 'Ev adresi', correct: 'private', explain: 'Bu, en hassas tek bilgi parçasıdır — asla çevrimiçi paylaşma.' },
  { text: 'Yüzünün net bir fotoğrafı', correct: 'private', explain: 'Gerçek fotoğraflar izin olmadan aranabilir, kaydedilebilir ve kullanılabilir.' },
  { text: 'Günlük program (örn. "her Salı antrenman")', correct: 'private', explain: 'Rutinler birine tam olarak ne zaman ve nerede seni bulacağını söyler.' },
  { text: 'Telefon numarası', correct: 'private', explain: 'Bir telefon numarası seninle iletişime geçmek, seni bulmak veya taklit etmek için kullanılabilir.' },
  { text: 'Tam doğum tarihi', correct: 'private', explain: 'Adınla birleştiğinde, bu genellikle bir kimliği çalmak için yeterlidir.' },
  { text: 'Ebeveynin tam adı ve iş yeri', correct: 'private', explain: 'Bu, aileni bulmak veya taklit etmek için kullanılabilir.' }
];

var ITEMS_ES = [
  { text: 'Apodo o nombre de jugador', correct: 'share', explain: 'Un apodo inventado no revela quién eres realmente.' },
  { text: 'Juego o pasatiempo favorito', correct: 'share', explain: 'Es totalmente seguro compartir tus intereses — así es como encuentras amigos con cosas en común.' },
  { text: 'Imagen de avatar de dibujos animados', correct: 'share', explain: 'Un avatar dibujado muestra tu personalidad sin revelar tu rostro real.' },
  { text: 'Récord de victorias/derrotas de tu equipo', correct: 'share', explain: 'Las estadísticas generales del juego no te identifican personalmente.' },
  { text: 'Nombre real completo', correct: 'private', explain: 'Tu nombre real es una de las formas más fáciles de ser identificado y buscado.' },
  { text: 'Nombre de la escuela', correct: 'private', explain: 'Esto le dice a un desconocido exactamente dónde encontrarte en persona.' },
  { text: 'Dirección de casa', correct: 'private', explain: 'Esta es la información más sensible que existe — nunca la compartas en línea.' },
  { text: 'Una foto clara de tu rostro', correct: 'private', explain: 'Las fotos reales pueden ser buscadas, guardadas y usadas sin tu permiso.' },
  { text: 'Rutina diaria (ej. "entrenamiento todos los martes")', correct: 'private', explain: 'Las rutinas le dicen a alguien exactamente cuándo y dónde encontrarte.' },
  { text: 'Número de teléfono', correct: 'private', explain: 'Un número de teléfono puede usarse para contactarte, localizarte o suplantarte.' },
  { text: 'Fecha de nacimiento exacta', correct: 'private', explain: 'Combinada con tu nombre, esto suele ser suficiente para robar una identidad.' },
  { text: 'Nombre completo y lugar de trabajo de tus padres', correct: 'private', explain: 'Esto puede usarse para ubicar o suplantar a tu familia.' }
];

var ITEMS = spbIsTr ? ITEMS_TR : spbIsEs ? ITEMS_ES : ITEMS_EN;

var order = [];
var placements = {};
var selectedIndex = null;

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function resetGame() {
  order = shuffle(ITEMS.map(function(_, i) { return i; }));
  placements = {};
  selectedIndex = null;
  render();
}

function selectItem(i) {
  selectedIndex = (selectedIndex === i) ? null : i;
  render();
}

function place(bucket) {
  if (selectedIndex === null) return;
  placements[selectedIndex] = bucket;
  selectedIndex = null;
  render();
}

function render() {
  var tray = document.getElementById('tray');
  var unplaced = order.filter(function(i) { return placements[i] === undefined; });
  tray.innerHTML = unplaced.length ? unplaced.map(function(i) {
    return '<button type="button" class="item-chip' + (selectedIndex === i ? ' selected' : '') + '" onclick="selectItem(' + i + ')">' + ITEMS[i].text + '</button>';
  }).join('') : '<span style="color:var(--gray);font-size:0.85rem;">' + (spbIsTr ? 'Tüm öğeler ayıklandı! Sonuçlarını aşağıda kontrol et.' : spbIsEs ? '¡Todos los elementos clasificados! Revisa tus resultados abajo.' : 'All items sorted! Check your results below.') + '</span>';

  ['share', 'private'].forEach(function(bucket) {
    var list = document.getElementById(bucket + '-list');
    var items = Object.keys(placements).filter(function(i) { return placements[i] === bucket; });
    list.innerHTML = items.map(function(i) {
      var item = ITEMS[i];
      var isCorrect = item.correct === bucket;
      return '<div class="placed-chip ' + (isCorrect ? 'correct' : 'wrong') + '">' + item.text +
        '<div class="placed-explain">' + (isCorrect ? '✅ ' : '❌ ') + item.explain + '</div></div>';
    }).join('');
  });

  var sortedCount = Object.keys(placements).length;
  var correctCount = Object.keys(placements).filter(function(i) { return placements[i] === ITEMS[i].correct; }).length;
  document.getElementById('score-num').textContent = spbIsTr ?
    (correctCount + ' / ' + ITEMS.length + ' doğru (' + sortedCount + ' ayıklandı)') :
    spbIsEs ?
    (correctCount + ' / ' + ITEMS.length + ' correctos (' + sortedCount + ' clasificados)') :
    (correctCount + ' / ' + ITEMS.length + ' correct (' + sortedCount + ' sorted)');

  if (sortedCount === ITEMS.length && window.DSKPoints && !localStorage.getItem('dsk_safeprofile_done')) {
    localStorage.setItem('dsk_safeprofile_done', '1');
    DSKPoints.addPoints(correctCount * 3, spbIsTr ? 'Güvenli Profilini Oluştur' : spbIsEs ? 'Construye Tu Perfil Seguro' : 'Build Your Safe Profile');
  }
}

resetGame();
</script>

<script src="/assets/lang-switcher.js"></script>
<script src="/assets/site-search.js"></script>
<script src="/assets/play-now-fab.js"></script>
</body>
</html>
