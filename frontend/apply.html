<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply to Join Our Team — Digital Safety Knights</title>
<link rel="canonical" href="https://digitalsafetyknights.org/apply.html">
<meta name="description" content="Apply for an open role at Digital Safety Knights — a small, growing nonprofit team.">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/knight-points.js"></script>
<script src="/assets/i18n.js"></script>
<style>
  :root { --navy: #0d1b3e; --navy2: #1a2f6e; --gold: #c9a84c; --gold2: #e8c56a; --light: #f4f6fb; --gray: #6c757d; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif; background: var(--light); color: #2d3748; }

  .ap-hero { background: var(--realm-bg); color: white; padding: 3rem 1.5rem 3.5rem; text-align: center; position: relative; overflow: hidden; }
  .ap-hero .eyebrow { color: var(--gold); font-weight: 900; letter-spacing: 2px; font-size: 0.8rem; text-transform: uppercase; }
  .ap-hero h1 { font-size: 2.1rem; font-weight: 900; margin: 10px 0 12px; }
  .ap-hero p { color: #cdd7f0; max-width: 560px; margin: 0 auto; line-height: 1.7; font-size: 1rem; }
  .ap-hero a.back { position: absolute; left: 1.5rem; top: 1.5rem; color: #cdd7f0; text-decoration: none; font-weight: 700; font-size: 0.85rem; }

  .ap-wrap { max-width: 620px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  .ap-section { background: white; border-radius: 18px; padding: 2rem; box-shadow: 0 6px 24px rgba(13,27,62,0.08); }

  .ap-form label { display: block; font-weight: 800; font-size: 0.85rem; color: var(--navy); margin: 1rem 0 6px; }
  .ap-form input, .ap-form select, .ap-form textarea { width: 100%; padding: 12px 14px; border: 2px solid #dfe4ee; border-radius: 10px; font-size: 0.95rem; font-family: inherit; background: white; }
  .ap-form textarea { min-height: 100px; resize: vertical; }
  .ap-submit { margin-top: 1.5rem; width: 100%; background: linear-gradient(135deg, var(--gold2), var(--gold)); color: var(--navy); border: none; padding: 16px; border-radius: 14px; font-weight: 900; font-size: 1rem; cursor: pointer; }
  .ap-submit:disabled { opacity: 0.6; cursor: default; }
  .ap-status { margin-top: 1rem; font-size: 0.9rem; font-weight: 700; padding: 12px; border-radius: 10px; display: none; }
  .ap-status.ok { display: block; background: #e6f4ea; color: #1e7d3a; }
  .ap-status.err { display: block; background: #fbe9e7; color: #c0392b; }

  footer { text-align: center; padding: 2rem; color: var(--gray); font-size: 0.85rem; }
</style>
</head>
<body>

<div class="ap-hero">
  <a href="/team.html" class="back">← Our Team</a>
  <div class="eyebrow">Digital Safety Knights</div>
  <h1>🛡️ Apply to Join Our Team</h1>
  <p>Tell us a bit about yourself — we're a small team and personally read every application.</p>
</div>

<div class="ap-wrap">
  <div class="ap-section">
    <form class="ap-form" id="ap-form">
      <label for="ap-role">Role You're Interested In</label>
      <select id="ap-role" required>
        <option value="school_partnerships">Director, School &amp; Community Partnerships</option>
        <option value="content_research">Content &amp; Research Lead</option>
        <option value="community_engagement">Community &amp; Digital Engagement Manager</option>
        <option value="volunteer_coordinator">Volunteer &amp; Knight Council Coordinator</option>
        <option value="other">Other / Not Sure Yet</option>
      </select>

      <label for="ap-name">Your Name</label>
      <input type="text" id="ap-name" required maxlength="80">

      <label for="ap-email">Email</label>
      <input type="email" id="ap-email" required maxlength="120">

      <label for="ap-message">Tell us about yourself — relevant experience, availability, why this role</label>
      <textarea id="ap-message" maxlength="2000"></textarea>

      <button type="submit" class="ap-submit" id="ap-submit">Submit Application</button>
      <div class="ap-status" id="ap-status"></div>
    </form>
  </div>
</div>

<footer>⚔️ Digital Safety Knights · digitalsafetyknights.org · © 2026</footer>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var role = params.get('role');
  if (role) {
    var sel = document.getElementById('ap-role');
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === role) { sel.selectedIndex = i; break; }
    }
  }
})();

document.getElementById('ap-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var submitBtn = document.getElementById('ap-submit');
  var statusEl = document.getElementById('ap-status');
  statusEl.className = 'ap-status';
  submitBtn.disabled = true;

  fetch('https://w6dqaq0l33.execute-api.us-east-1.amazonaws.com/prod/volunteer-apply', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      role: document.getElementById('ap-role').value,
      name: document.getElementById('ap-name').value.trim(),
      email: document.getElementById('ap-email').value.trim(),
      message: document.getElementById('ap-message').value.trim()
    })
  })
  .then(function (r) { return r.json(); })
  .then(function (data) {
    submitBtn.disabled = false;
    if (data.success) {
      statusEl.className = 'ap-status ok';
      statusEl.textContent = data.message;
      document.getElementById('ap-form').reset();
    } else {
      statusEl.className = 'ap-status err';
      statusEl.textContent = '❌ ' + (data.message || 'Something went wrong.');
    }
  })
  .catch(function () {
    submitBtn.disabled = false;
    statusEl.className = 'ap-status err';
    statusEl.textContent = '❌ Connection error. Please try again.';
  });
});
</script>
<script src="/assets/lang-switcher.js"></script>
</body>
</html>
