<div class="wrap">
  <div class="hero">
    <div class="icon">🔍</div>
    <h1 data-i18n="mvf.title">Myth vs Fact</h1>
    <p data-i18n="mvf.subtitle">Tap a myth to reveal the real answer — the stuff parents actually search for at 11pm.</p>
  </div>

</div>

<script>
const PAIRS_EN = [
  { myth: "My kid's game chat looks clean when I check it, so it's safe.", fact: "A clean visible chat log doesn't mean much — many risky conversations move to private in-experience channels or linked Discord servers you haven't seen. Check for linked servers, not just the chat you can already see." },
  { myth: "If I don't give my kid a phone, they're safe from online risks.", fact: "Kids access the internet through school devices, friends' phones, gaming consoles, and shared family tablets. Delaying a personal phone is reasonable, but it isn't a safety plan on its own — the habits and conversations matter more than the device." },
  { myth: "A strong password is all my child's account really needs.", fact: "A strong, unique password matters, but two-factor authentication is what actually stops most account takeovers — even a stolen password is useless to an attacker without the second step." },
  { myth: "My child would tell me right away if something happened.", fact: "Most kids delay telling a parent because they fear losing device access or getting in trouble — not because they don't trust you. Make it explicit and repeated: telling you is never punished, no matter what." },
  { myth: "Online predators are always obvious strangers with fake profiles.", fact: "Grooming typically starts with a normal-looking profile and weeks of ordinary, friendly conversation before anything concerning happens. The red flag isn't how someone looks — it's the pattern: gifts, secrecy requests, and escalation." },
  { myth: "Deleting an app removes the risk once something's gone wrong.", fact: "Deleting first destroys the evidence needed to report what happened. Screenshot everything, tell a trusted adult, and only then decide what to do with the account or app." },
  { myth: "AI chatbot 'friends' are basically harmless entertainment.", fact: "AI companions that always agree and never push back are a documented design pattern (sycophancy) that can reinforce bad decisions and unhealthy attachment, especially for isolated kids. Worth checking in on, not just dismissing as a toy." },
  { myth: "A screen-time limit solves most of the real risk.", fact: "Screen-time limits address overuse, not the content or contact risks that happen in minutes, not hours. A single risky conversation can happen in a 10-minute session — settings and conversations matter more than the clock." },
  { myth: "If content breaks platform rules, it gets removed quickly.", fact: "Moderation is inconsistent and often slow, especially for coded language, private DMs, or content that's borderline rather than obviously against the rules. Reporting is still worth doing, but don't assume it's instant or guaranteed." },
  { myth: "Sextortion mainly targets teen girls.", fact: "Financial sextortion (as opposed to older, image-focused sextortion patterns) has surged specifically among teen boys, often moving from first contact to threat within hours. It's one of the fastest-growing threats regardless of gender." },
  { myth: "My teenager is too smart and tech-savvy to fall for a scam.", fact: "Sophistication doesn't prevent social engineering — scams targeting teens are built around urgency, social proof, and emotional pressure, not technical trickery. Confidence with technology isn't the same skill as recognizing manipulation." }
];

const PAIRS_TR = [
  { myth: "Çocuğumun oyun sohbeti kontrol ettiğimde temiz görünüyor, yani güvenli.", fact: "Temiz görünen bir sohbet kaydı pek bir şey ifade etmez — birçok riskli konuşma, görmediğiniz özel oyun içi kanallara veya bağlı Discord sunucularına taşınır. Sadece görebildiğiniz sohbeti değil, bağlı sunucuları da kontrol edin." },
  { myth: "Çocuğuma telefon vermezsem çevrimiçi risklerden güvende olur.", fact: "Çocuklar okul cihazları, arkadaşlarının telefonları, oyun konsolları ve paylaşılan aile tabletleri üzerinden internete erişir. Kişisel bir telefonu geciktirmek makul, ama tek başına bir güvenlik planı değildir — alışkanlıklar ve konuşmalar cihazdan daha önemlidir." },
  { myth: "Güçlü bir şifre, çocuğumun hesabının gerçekten ihtiyacı olan tek şey.", fact: "Güçlü, benzersiz bir şifre önemlidir, ama çoğu hesap ele geçirmeyi asıl durduran şey iki faktörlü kimlik doğrulamadır — çalınan bir şifre bile ikinci adım olmadan bir saldırgana işe yaramaz." },
  { myth: "Bir şey olursa çocuğum bana hemen söyler.", fact: "Çoğu çocuk, cihaz erişimini kaybetmekten veya başının belaya girmesinden korktuğu için ebeveynine söylemeyi erteler — size güvenmedikleri için değil. Bunu açık ve tekrar tekrar belirtin: söylemek asla cezalandırılmaz, ne olursa olsun." },
  { myth: "Çevrimiçi istismarcılar her zaman sahte profilli belirgin yabancılardır.", fact: "Kandırma genellikle normal görünen bir profille ve endişe verici bir şey olmadan önce haftalarca süren sıradan, dostça bir konuşmayla başlar. Uyarı işareti birinin nasıl göründüğü değil — örüntüdür: hediyeler, gizlilik istekleri ve tırmanma." },
  { myth: "Bir şey ters gittiğinde bir uygulamayı silmek riski ortadan kaldırır.", fact: "Önce silmek, ne olduğunu bildirmek için gereken kanıtı yok eder. Her şeyin ekran görüntüsünü alın, güvendiğiniz bir yetişkine söyleyin, ve ancak sonra hesap ya da uygulamayla ne yapılacağına karar verin." },
  { myth: "Yapay zeka sohbet botu 'arkadaşları' aslında zararsız bir eğlence.", fact: "Her zaman katılan ve asla karşı çıkmayan yapay zeka arkadaşları, kötü kararları ve özellikle yalnız çocuklarda sağlıksız bağlanmayı pekiştirebilen belgelenmiş bir tasarım biçimidir (yağcılık). Bir oyuncak diye göz ardı etmek yerine kontrol etmeye değer." },
  { myth: "Bir ekran süresi sınırı gerçek riskin çoğunu çözer.", fact: "Ekran süresi sınırları aşırı kullanımı ele alır, dakikalar içinde (saatler değil) olan içerik veya temas risklerini değil. Tek bir riskli konuşma 10 dakikalık bir oturumda gerçekleşebilir — ayarlar ve konuşmalar saatten daha önemlidir." },
  { myth: "İçerik platform kurallarını ihlal ederse hızlıca kaldırılır.", fact: "Moderasyon tutarsız ve genellikle yavaştır, özellikle şifreli dil, özel DM'ler veya kurallara açıkça aykırı olmaktan çok sınırda olan içerik için. Bildirmek hâlâ değerlidir, ama anında ya da garanti olduğunu varsaymayın." },
  { myth: "Şantaj çoğunlukla genç kızları hedefler.", fact: "Finansal şantaj (eski, görüntü odaklı şantaj örüntülerinin aksine) özellikle genç erkekler arasında arttı, genellikle ilk temastan tehdide saatler içinde geçiyor. Cinsiyetten bağımsız en hızlı büyüyen tehditlerden biri." },
  { myth: "Gencim bir dolandırıcılığa düşmeyecek kadar akıllı ve teknoloji bilgili.", fact: "Sofistikelik sosyal mühendisliği önlemez — gençleri hedefleyen dolandırıcılıklar teknik hilelerden çok aciliyet, sosyal kanıt ve duygusal baskı üzerine kuruludur. Teknolojiye güven, manipülasyonu tanımakla aynı beceri değildir." }
];

const PAIRS_ES = [
  { myth: "El chat del juego de mi hijo se ve limpio cuando lo reviso, así que es seguro.", fact: "Un registro de chat visible y limpio no significa mucho — muchas conversaciones riesgosas se trasladan a canales privados dentro del juego o a servidores de Discord vinculados que no has visto. Revisa si hay servidores vinculados, no solo el chat que ya puedes ver." },
  { myth: "Si no le doy un teléfono a mi hijo, está a salvo de los riesgos en línea.", fact: "Los niños acceden a internet a través de dispositivos escolares, teléfonos de amigos, consolas de videojuegos y tablets familiares compartidas. Retrasar un teléfono personal es razonable, pero no es un plan de seguridad por sí solo — los hábitos y las conversaciones importan más que el dispositivo." },
  { myth: "Una contraseña fuerte es todo lo que la cuenta de mi hijo realmente necesita.", fact: "Una contraseña fuerte y única importa, pero la autenticación de dos factores es lo que realmente detiene la mayoría de los robos de cuenta — incluso una contraseña robada es inútil para un atacante sin ese segundo paso." },
  { myth: "Mi hijo me contaría de inmediato si algo pasara.", fact: "La mayoría de los niños retrasan contarle a un padre porque temen perder el acceso al dispositivo o meterse en problemas — no porque no confíen en ti. Déjalo explícito y repítelo: contarte nunca se castiga, pase lo que pase." },
  { myth: "Los depredadores en línea siempre son desconocidos obvios con perfiles falsos.", fact: "El grooming típicamente empieza con un perfil de apariencia normal y semanas de conversación común y amistosa antes de que ocurra algo preocupante. La señal de alerta no es cómo se ve alguien — es el patrón: regalos, peticiones de guardar el secreto y escalada." },
  { myth: "Borrar una app elimina el riesgo una vez que algo salió mal.", fact: "Borrar primero destruye la evidencia necesaria para reportar lo que pasó. Toma capturas de pantalla de todo, cuéntaselo a un adulto de confianza, y solo después decide qué hacer con la cuenta o la app." },
  { myth: "Los 'amigos' chatbot de IA son básicamente un entretenimiento inofensivo.", fact: "Los compañeros de IA que siempre están de acuerdo y nunca discrepan son un patrón de diseño documentado (adulación) que puede reforzar malas decisiones y apegos poco saludables, especialmente en niños aislados. Vale la pena prestarles atención, no descartarlos simplemente como un juguete." },
  { myth: "Un límite de tiempo de pantalla resuelve la mayor parte del riesgo real.", fact: "Los límites de tiempo de pantalla abordan el uso excesivo, no los riesgos de contenido o contacto que ocurren en minutos, no en horas. Una sola conversación riesgosa puede pasar en una sesión de 10 minutos — la configuración y las conversaciones importan más que el reloj." },
  { myth: "Si un contenido rompe las reglas de la plataforma, se elimina rápido.", fact: "La moderación es inconsistente y a menudo lenta, especialmente con lenguaje en clave, mensajes directos privados o contenido que está en el límite en vez de violar las reglas obviamente. Reportar sigue valiendo la pena, pero no asumas que es instantáneo ni garantizado." },
  { myth: "La sextorsión afecta principalmente a las chicas adolescentes.", fact: "La sextorsión financiera (a diferencia de los patrones más antiguos centrados en imágenes) se ha disparado específicamente entre los chicos adolescentes, y a menudo pasa del primer contacto a la amenaza en cuestión de horas. Es una de las amenazas de más rápido crecimiento sin importar el género." },
  { myth: "Mi adolescente es demasiado listo y hábil con la tecnología para caer en una estafa.", fact: "La sofisticación no evita la ingeniería social — las estafas dirigidas a adolescentes se construyen a partir de urgencia, prueba social y presión emocional, no de trucos técnicos. Ser hábil con la tecnología no es la misma habilidad que reconocer la manipulación." }
];

const MVF_LABELS_TR = { myth: "❌ Efsane", fact: "✅ Gerçek", tapHint: "Gerçeği görmek için dokun →", shareBtn: "🔗 Bunu Paylaş", backBtn: "← Geri" };
const MVF_LABELS_ES = { myth: "❌ Mito", fact: "✅ Realidad", tapHint: "Toca para ver la realidad →", shareBtn: "🔗 Compartir esto", backBtn: "← Volver" };
const lang = (window.DSKi18n && DSKi18n.lang) || 'en';
const isTr = lang === 'tr';
const isEs = lang === 'es';
const PAIRS = isTr ? PAIRS_TR : isEs ? PAIRS_ES : PAIRS_EN;
const L = isTr ? MVF_LABELS_TR : isEs ? MVF_LABELS_ES : { myth: "❌ Myth", fact: "✅ Fact", tapHint: "Tap to see the fact →", shareBtn: "🔗 Share this", backBtn: "← Back" };

const grid = document.getElementById('mvf-grid');
grid.innerHTML = PAIRS.map((p, i) => `
  <div class="mvf-card">
    <div class="mvf-myth" id="myth-${i}" onclick="revealFact(${i})">
      <div class="mvf-label">${L.myth}</div>
      <h3>${p.myth}</h3>
      <div class="tap-hint">${L.tapHint}</div>
    </div>
    <div class="mvf-fact" id="fact-${i}">
      <div class="mvf-label">${L.fact}</div>
      <p>${p.fact}</p>
      <div class="fact-actions">
        <button type="button" class="fact-btn" onclick="event.stopPropagation();shareFact(${i})">${L.shareBtn}</button>
        <button type="button" class="fact-btn" onclick="event.stopPropagation();hideFact(${i})">${L.backBtn}</button>
      </div>
    </div>
  </div>
`).join('');

function revealFact(i) {
  document.getElementById('myth-' + i).style.display = 'none';
  document.getElementById('fact-' + i).classList.add('show');
  if (window.DSKPoints) DSKPoints.markComboActivity('guide');
}
function hideFact(i) {
  document.getElementById('fact-' + i).classList.remove('show');
  document.getElementById('myth-' + i).style.display = '';
}
function shareFact(i) {
  const p = PAIRS[i];
  const mythWord = isTr ? 'Efsane' : isEs ? 'Mito' : 'Myth';
  const factWord = isTr ? 'Gerçek' : isEs ? 'Realidad' : 'Fact';
  const text = mythWord + ': ' + p.myth + '\n\n' + factWord + ': ' + p.fact + '\n\n— Digital Safety Knights (digitalsafetyknights.org)';
  if (navigator.share) {
    navigator.share({ text: text }).catch(function() {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() {
      if (window.DSKPoints && window.DSKPoints.showToast) window.DSKPoints.showToast(isTr ? 'Panoya kopyalandı!' : isEs ? '¡Copiado al portapapeles!' : 'Copied to clipboard!');
    });
  }
}
</script>
