  if (player) {
    const bob = g.y > 0 ? 0 : Math.abs(Math.sin(g.phase)) * 0.13;
    player.position.set(g.x, g.y + bob, 0);
    player.rotation.z = Math.sin(g.phase) * 0.05 - (tx - g.x) * 0.12;
    player.rotation.x = g.y > 0 ? -0.15 : 0.06;
    const s = 1 - g.squash; player.scale.set(1 + g.squash * 0.5, s, 1 + g.squash * 0.5);
    if (g.invuln > 0) { g.invuln -= dt; player.visible = Math.floor(g.invuln * 12) % 2 === 0; } else player.visible = true;
    shadow.position.x = g.x; shadow.scale.setScalar(1 - Math.min(0.5, g.y * 0.18));
  }

  // items
  for (let i = g.items.length - 1; i >= 0; i--) {
    const it = g.items[i];
    it.obj.position.z += dz;
    const z = it.obj.position.z;
    if (it.kind === 'coin') { it.obj.rotation.y += dt * 4; }
    if (it.kind === 'sign') it.obj.children[1].position.y = 2.05 + Math.sin(g.t * 2 + it.lane) * 0.06;
    if (playing && !it.done) {
      const near = Math.abs(z) < 0.75, same = Math.abs(g.x - it.lane * LANE) < 1.1;
      if (it.kind === 'coin' && near && same && Math.abs((g.y + 0.8) - it.obj.position.y) < 1.1) {
        it.done = true; g.coins++; g.bonus += 5; SFX.coin(); burst(it.obj.position.x, it.obj.position.y + 0.3, z, 4, 0xffe08a, 0.24);
        scene.remove(it.obj); g.items.splice(i, 1); continue;
      }
      if (it.kind === 'crate' && near && same && g.y < 0.95 && g.invuln <= 0) {
        it.done = true; flash(S.crate, '#ffd76a'); hurt(); if (g.mode !== 'play') return;
      }
      if (it.kind === 'sign' && z > 0) { it.done = true; resolveSign(it); if (g.mode !== 'play') return; }
    }
    if (z > Z0 - 2) { scene.remove(it.obj); if (it.obj.userData.dispose) it.obj.userData.dispose(); g.items.splice(i, 1); }
  }

  // Glitch pops up at the roadside when a trick gets through
  if (glitch) {
    if (g.glitchT > 0) {
      g.glitchT -= dt;
      const k = Math.min(1, (2.2 - g.glitchT) / 0.35) * Math.min(1, g.glitchT / 0.35);
      glitch.visible = true;
      glitch.position.set(g.glitchSide * 4.4, -1.9 + 1.9 * k + Math.abs(Math.sin(g.t * 10)) * 0.15 * k, -7);
      glitch.rotation.y = -g.glitchSide * 0.5;
    } else glitch.visible = false;
  }

  // sparkles
  for (const p of sparks) {
    if (p.t <= 0) continue;
    p.t -= dt; p.v.y -= 9 * dt; p.s.position.addScaledVector(p.v, dt); p.s.position.z += dz;
    p.s.material.opacity = Math.min(1, p.t * 2); if (p.t <= 0) p.s.visible = false;
  }

  // camera follows, a little behind and above
  const portrait = camera.aspect < 1;
  camera.position.set(g.x * 0.45, (portrait ? 3.7 : 3.3) + g.y * 0.25, portrait ? 6.9 : 6.6);
  if (g.shake > 0) { g.shake -= dt; camera.position.x += (Math.random() - 0.5) * 0.3; camera.position.y += (Math.random() - 0.5) * 0.3; }
  camera.lookAt(g.x * 0.55, 1.1, -9);

  if (flashTimer > 0) { flashTimer -= dt; if (flashTimer <= 0) $('flash').style.opacity = 0; }
  if (playing) hud();
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = camera.aspect < 1 ? 74 : 58; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

manager.onLoad = () => {
  if (loadFailed || !M.shieldy || !M.glitch || !M.lantern || !M.tower) { $('t-load').textContent = S.loadErr; return; }
  // turn him round to face down the road; the turn sits on its own group so it
  // pivots on his centre and the lean/tilt below stay in the camera's frame
  M.shieldy.rotation.y = Math.PI; player = new THREE.Group(); player.add(M.shieldy); scene.add(player);
  shadow = new THREE.Mesh(new THREE.CircleGeometry(0.62, 28), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.32, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.02; scene.add(shadow);
  glitch = M.glitch; glitch.visible = false; scene.add(glitch);
  addScenery(i => {
    const o = M.lantern.clone(); o.position.x = (i % 2 ? 1 : -1) * (ROAD_W / 2 + 0.75);
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.9 }));
    halo.scale.set(2.2, 2.2, 1); halo.position.y = 3.0; o.add(halo); return o;
  }, 7, 20);   // 140 units: the fog hides anything further
  addScenery(i => {
    const o = M.tower.clone(), s = 6.5 + Math.random() * 4;
    o.scale.setScalar(s); o.rotation.y = Math.random() * 6.28;
    o.position.x = (i % 2 ? 1 : -1) * (13 + Math.random() * 4); return o;
  }, 13, 11);
  $('ov-load').hidden = true; $('ov-title').hidden = false; $('b-start').focus();
  g.mode = 'title';
};

let last = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!document.hidden) { update(dt); renderer.render(scene, camera); }
});

// Read-only view of the run plus the same inputs a player has, so the game
// can be driven end to end in a test.
window.ShieldyRun = {
  state: () => ({ mode: g.mode, speed: g.speed, t: g.t, lane: g.lane, x: g.x, y: g.y, hearts: g.hearts, coins: g.coins, dist: g.dist, bonus: g.bonus, missed: g.missed,
    items: g.items.filter(i => !i.done).map(i => ({ kind: i.kind, lane: i.lane, z: i.obj.position.z, trap: i.sign ? i.sign.trap : undefined })) }),
  input: act, step: (dt) => update(dt), render: () => renderer.render(scene, camera),
  info: () => ({ calls: renderer.info.render.calls, triangles: renderer.info.render.triangles })
};
</script>
</body>
</html>
