(function () {

      start: 'Empezar', again: 'Jugar otra vez', arcade: '← Volver al Arcade', back: '← Arcade',
      over: 'Shieldy necesita un descanso', best: 'Mejor', missed: 'Lo que se te pasó:',
      hold: 'MANTÉN = escudo', blocked: '¡Bloqueado!', oops: '¡Era un amigo!', reason: 'Shieldy Dash',
      lever: { urgency: 'Urgencia', secrecy: 'Secretismo', flattery: 'Halagos', fear: 'Miedo' },
      rule: {

        friend: 'No todo es una amenaza: algunos de esos eran amigos.'
      },
      red: {
        urgency: ['¡ROBUX GRATIS! ¡Solo quedan 10 segundos!', '¡Haz clic YA o pierdes tu cuenta!', '¡Última oportunidad! La oferta termina en 1 minuto.'],
        secrecy: ['No les cuentes esto a tus papás.', 'Este es nuestro secretito, ¿ok?', 'Borra este chat después de leerlo.'],
        flattery: ['¡Eres mi persona favorita! ¿Me pasas tu número?', 'Eres especial. Hablemos en otra app.', 'Solo confío en ti. ¿Cuál es tu dirección?'],
        fear: ['¡Dame tus skins o hago que te baneen!', '¡Hackearon tu cuenta! Mándame tu contraseña.', 'Hazlo o le cuento tu secreto a todos.']
      },
      safe: ['¿Jugamos después de la tarea?', '¡La abuela te manda saludos! 👋', 'El entrenamiento es hoy a las 5.', '¡Golazo en el partido!', '¿Terminaste la hoja de mate?', 'Mamá: ¡la cena está lista!', '¡¡Feliz cumpleaños!! 🎂', '¿Noche de película el viernes?', 'Tu libro de la biblioteca vence pronto.', '¡Suerte en tu examen!', '¿Me prestas tus apuntes?', 'La foto del equipo es mañana.']
    },
    fr: {
      how: 'Des messages arrivent sur Shieldy. Lis chacun d’eux. MAINTIENS l’écran appuyé (ou Espace) pour lever le bouclier contre un piège — et laisse passer tes amis. Trois erreurs et la partie s’arrête.',
      start: 'Commencer', again: 'Rejouer', arcade: '← Retour à l’Arcade', back: '← Arcade',
      over: 'Shieldy a besoin d’une pause', best: 'Record', missed: 'Ce qui t’a échappé :',
      hold: 'MAINTIENS = bouclier', blocked: 'Bloqué !', oops: 'C’était un ami !', reason: 'Shieldy Dash',
      lever: { urgency: 'Urgence', secrecy: 'Secret', flattery: 'Flatterie', fear: 'Peur' },
      rule: {
        urgency: 'Un compte à rebours est un piège. Le vrai ne disparaît pas en dix secondes.',
        secrecy: '« Ne dis rien » : le signal d’alerte, c’est cette phrase.',
        flattery: 'Des compliments soudains, puis une demande. Le piège est dans cet ordre.',
        fear: 'Une menace ne marche que dans le silence. Parles-en à un adulte.',
        friend: 'Tout n’est pas une menace : certains étaient des amis.'
      },
      red: {
        urgency: ['ROBUX GRATUITS ! Plus que 10 secondes !', 'Clique MAINTENANT ou tu perds ton compte !', 'Dernière chance ! L’offre finit dans 1 minute !'],
        secrecy: ['Ne dis rien à tes parents.', 'C’est notre petit secret, d’accord ?', 'Supprime cette conversation après l’avoir lue.'],
        flattery: ['C’est toi que je préfère ! Tu m’envoies ton numéro ?', 'Tu n’es pas comme les autres. On parle sur une autre appli ?', 'Je ne fais confiance qu’à toi. C’est quoi ton adresse ?'],
        fear: ['Donne-moi tes skins ou je te fais bannir !', 'Ton compte est piraté ! Envoie-moi ton mot de passe.', 'Fais-le ou je dis ton secret à tout le monde.']
      },
      safe: ['On joue après les devoirs ?', 'Mamie te fait un coucou ! 👋', 'L’entraînement est à 17 h aujourd’hui.', 'Super but pendant le match !', 'Tu as fini la fiche de maths ?', 'Maman : à table !', 'Joyeux anniversaire !! 🎂', 'Soirée film vendredi ?', 'Ton livre de bibliothèque est à rendre.', 'Bonne chance pour ton contrôle !', 'Tu me prêtes tes notes ?', 'La photo d’équipe, c’est demain.']
    }
  };

  var lang = (window.DSKi18n && DSKi18n.lang) || 'en';
  if (!W[lang]) lang = 'en';
  document.documentElement.setAttribute('lang', lang);
  var S = W[lang];
  // French typography: a narrow no-break space before ! ? : ; — applied once
  // here rather than typed into every string above.
  if (lang === 'fr') {
    var nb = function (s) { return s.replace(/ ([!?:;»])/g, ' $1').replace(/« /g, '« '); };
    (function walk(o) { for (var k in o) { if (typeof o[k] === 'string') o[k] = nb(o[k]); else walk(o[k]); } })(S);
  }
  var LEVERS = ['urgency', 'secrecy', 'flattery', 'fear'];

  var $ = function (id) { return document.getElementById(id); };
  $('t-back').textContent = S.back; $('t-how').textContent = S.how;
  $('b-start').textContent = S.start; $('b-again').textContent = S.again;
  $('b-arcade').textContent = S.arcade; $('t-over').textContent = S.over;
  $('t-missed').textContent = S.missed;

  /* ───────── canvas ───────── */
  var cv = $('c'), cx = cv.getContext('2d'), Wd = 0, Ht = 0, dpr = 1;
  function resize() {
    var r = $('stage').getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    Wd = Math.max(240, r.width); Ht = Math.max(320, r.height);
    cv.width = Math.round(Wd * dpr); cv.height = Math.round(Ht * dpr);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (g.cur) g.cur.lines = null;
  }

  /* ───────── state ───────── */
  var BEST_KEY = 'dsk_dash_best';
  var g = { mode: 'title', score: 0, hearts: 3, combo: 0, n: 0, cur: null, wait: 0,
            shield: false, flash: null, shake: 0, missed: {}, deckR: [], deckS: [], parts: [] };
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function shuffled(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function nextMsg() {
    var red = Math.random() < 0.55;
    if (red) {
      if (!g.deckR.length) { var all = []; LEVERS.forEach(function (l) { S.red[l].forEach(function (t) { all.push({ text: t, lever: l }); }); }); g.deckR = shuffled(all); }
      var m = g.deckR.pop(); return { text: m.text, red: true, lever: m.lever };
    }
    if (!g.deckS.length) g.deckS = shuffled(S.safe);
    return { text: g.deckS.pop(), red: false };
  }

  function start() {
    g.mode = 'play'; g.score = 0; g.hearts = 3; g.combo = 0; g.n = 0; g.cur = null; g.wait = 0.5;
    g.flash = null; g.shake = 0; g.missed = {}; g.deckR = []; g.deckS = []; g.parts = []; g.shield = false;
    $('ov-title').hidden = true; $('ov-over').hidden = true;
  }

  function spawn() {
    var m = nextMsg();
    // Travel time is the reading time. It starts generous and tightens.
    m.T = Math.max(1.15, 2.7 - g.n * 0.045); m.t = 0; m.lines = null;
    g.cur = m; g.n++;
  }

  function burst(color) {
    if (reduced) return;
    for (var i = 0; i < 14; i++) { var a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 160; g.parts.push({ x: Wd / 2, y: Ht * 0.55, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, t: 0.6, c: color }); }
  }

  function resolve() {
    var m = g.cur, blocked = g.shield; g.cur = null; g.wait = 0.28;
    if (m.red && blocked) { g.combo++; g.score += 10 + Math.min(g.combo, 10) * 2; g.flash = { c: '#7dffb0', t: 0.7, s: S.blocked }; burst('#e8c56a'); react('block'); }
    else if (!m.red && !blocked) { g.combo++; g.score += 5; react('pass'); }
    else {
      g.hearts--; g.combo = 0; g.shake = reduced ? 0 : 0.3;
      var k = m.red ? m.lever : 'friend';
      g.missed[k] = (g.missed[k] || 0) + 1;
      g.flash = m.red ? { c: '#ff7a85', t: 1.0, s: S.lever[m.lever] + '!' } : { c: '#ffd76a', t: 1.0, s: S.oops };
      react(m.red ? 'trick' : 'friend');
      if (g.hearts <= 0) end();
    }
  }

  function end() {
    g.mode = 'over'; SFX.over();
    var best = 0; try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10); } catch (e) {}
    if (g.score > best) { best = g.score; try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }
    $('o-score').textContent = g.score;
    $('o-best').textContent = S.best + ': ' + best;
    var list = $('o-list'); list.innerHTML = '';
    LEVERS.concat(['friend']).forEach(function (k) {
      if (!g.missed[k]) return;
      var li = document.createElement('li');
      if (k === 'friend') li.className = 'friend';
      var b = document.createElement('b');
      b.textContent = (k === 'friend' ? S.oops : S.lever[k]) + ' ×' + g.missed[k] + ' — ';
      li.appendChild(b); li.appendChild(document.createTextNode(S.rule[k]));
      list.appendChild(li);
    });
    $('ov-over').hidden = false;
    if (window.DSKPoints) {
      var pts = Math.min(15, Math.floor(g.score / 50));
      if (pts > 0) DSKPoints.addPoints(pts, S.reason);
      if (DSKPoints.markComboActivity) DSKPoints.markComboActivity('game');
    }
  }

  /* ───────── input: one button ───────── */
  function down(e) { if (g.mode === 'play') { g.shield = true; if (e && e.preventDefault) e.preventDefault(); } }
  function up() { g.shield = false; }
  cv.addEventListener('pointerdown', down);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  window.addEventListener('blur', up);
  window.addEventListener('keydown', function (e) { if (e.code === 'Space') { if (g.mode === 'play') e.preventDefault(); down(); } });
  window.addEventListener('keyup', function (e) { if (e.code === 'Space') up(); });
  $('b-start').onclick = start; $('b-again').onclick = start;

  /* ───────── art and sound ─────────
     The characters are the ones from the films (see infrastructure/
     build-arcade-art.py). If an image fails to load the game still runs —
     it just draws without that sprite. */
  var ART = {}, ART_BASE = '/assets/arcade/';
  ['bg-castle-road', 'shieldy-ready', 'shieldy-shield', 'shieldy-oops', 'shieldy-cheer', 'glitch-laugh', 'glitch-grr']
    .forEach(function (n) { var im = new Image(); im.src = ART_BASE + n + '.webp'; ART[n] = im; });
  function ok(im) { return im && im.complete && im.naturalWidth > 0; }

  var snd = true, ac = null;
  try { snd = localStorage.getItem('dsk_dash_snd') !== '0'; } catch (e) {}
  $('b-snd').setAttribute('aria-label', ({ en: 'Sound', tr: 'Ses', es: 'Sonido', fr: 'Son' })[lang]);
  function paintSnd() { $('b-snd').textContent = snd ? '🔊' : '🔇'; }
  $('b-snd').onclick = function () { snd = !snd; try { localStorage.setItem('dsk_dash_snd', snd ? '1' : '0'); } catch (e) {} paintSnd(); };
  paintSnd();
  function tone(freqs, dur, type, vol) {
    if (!snd) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var t0 = ac.currentTime, o = ac.createOscillator(), gn = ac.createGain();
      o.type = type || 'triangle';
      freqs.forEach(function (f, i) { o.frequency.setValueAtTime(f, t0 + i * dur / freqs.length); });
      gn.gain.setValueAtTime(vol || 0.12, t0); gn.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(gn); gn.connect(ac.destination); o.start(t0); o.stop(t0 + dur);
    } catch (e) {}
  }
  var SFX = {
    block: function () { tone([523, 784, 1047], 0.22, 'triangle', 0.14); },
    pass: function () { tone([660, 880], 0.12, 'sine', 0.07); },
    oops: function () { tone([220, 147], 0.35, 'sawtooth', 0.09); },
    over: function () { tone([392, 330, 262, 196], 0.7, 'triangle', 0.12); }
  };

  function rr(x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }
  function wrap(text, maxW) {
    var words = text.split(' '), lines = [], line = '';
    for (var i = 0; i < words.length; i++) { var t = line ? line + ' ' + words[i] : words[i]; if (cx.measureText(t).width > maxW && line) { lines.push(line); line = words[i]; } else line = t; }
    if (line) lines.push(line); return lines;
  }
  function sprite(im, cxm, bottom, h) {           // draw by centre-x and feet
    if (!ok(im)) return;
    var w = h * im.naturalWidth / im.naturalHeight;
    cx.drawImage(im, cxm - w / 2, bottom - h, w, h);
  }

  var clock = 0, pose = 'ready', poseT = 0, villain = null, flies = [];
  for (var fi = 0; fi < 16; fi++) flies.push({ x: Math.random(), y: Math.random(), s: 0.4 + Math.random(), p: Math.random() * 6 });

  function react(kind) {            // called from resolve()
    if (kind === 'block') { pose = 'cheer'; poseT = 0.5; villain = { im: 'glitch-grr', t: 0.9 }; SFX.block(); }
    else if (kind === 'pass') { SFX.pass(); }
    else { pose = 'oops'; poseT = 0.75; if (kind === 'trick') villain = { im: 'glitch-laugh', t: 1.1 }; SFX.oops(); }
  }

  function frame(dt) {
    clock += dt;
    if (g.mode === 'play') {
      if (!g.cur) { g.wait -= dt; if (g.wait <= 0) spawn(); }
      else { g.cur.t += dt; if (g.cur.t >= g.cur.T) resolve(); }
    }
    if (poseT > 0) { poseT -= dt; if (poseT <= 0) pose = 'ready'; }
    if (villain) { villain.t -= dt; if (villain.t <= 0) villain = null; }
    if (g.flash) { g.flash.t -= dt; if (g.flash.t <= 0) g.flash = null; }
    if (g.shake > 0) g.shake -= dt;

    cx.save();
    if (g.shake > 0) cx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);

    // background, cover-fitted; the portal's position follows the same mapping
    var bg = ART['bg-castle-road'], px = Wd / 2, py = Ht * 0.45;
    if (ok(bg)) {
      var sc = Math.max(Wd / bg.naturalWidth, Ht / bg.naturalHeight);
      var bw0 = bg.naturalWidth * sc, bh0 = bg.naturalHeight * sc, bx = (Wd - bw0) / 2, by = (Ht - bh0) / 2;
      cx.drawImage(bg, bx - 8, by - 8, bw0 + 16, bh0 + 16);
      px = bx + bw0 * 0.5; py = by + bh0 * 0.452;
    } else { cx.fillStyle = '#16264f'; cx.fillRect(-10, -10, Wd + 20, Ht + 20); }
    // the portal breathes
    var pulse = 0.5 + 0.5 * Math.sin(clock * 3);
    var pg = cx.createRadialGradient(px, py, 2, px, py, 46 + pulse * 14);
    pg.addColorStop(0, 'rgba(140,220,255,' + (0.5 + pulse * 0.25) + ')'); pg.addColorStop(1, 'rgba(140,220,255,0)');
    cx.fillStyle = pg; cx.beginPath(); cx.arc(px, py, 60 + pulse * 14, 0, 7); cx.fill();
    // fireflies
    if (!reduced) flies.forEach(function (f) {
      var fx = (f.x + Math.sin(clock * 0.4 * f.s + f.p) * 0.04) * Wd, fy = ((f.y + clock * 0.012 * f.s) % 1) * Ht * 0.8;
      cx.globalAlpha = 0.35 + 0.35 * Math.sin(clock * 2 * f.s + f.p); cx.fillStyle = '#ffe9a8';
      cx.beginPath(); cx.arc(fx, fy, 1.6 * f.s, 0, 7); cx.fill();
    });
    cx.globalAlpha = 1;
    // top shade so the HUD reads on any part of the sky
    var tg = cx.createLinearGradient(0, 0, 0, 90); tg.addColorStop(0, 'rgba(7,14,36,.75)'); tg.addColorStop(1, 'rgba(7,14,36,0)');
    cx.fillStyle = tg; cx.fillRect(-10, -10, Wd + 20, 100);

    var sx = Wd / 2, feet = Ht - 14, hS = Math.min(Ht * 0.36, 300);
    var bob = (g.mode === 'play' && pose === 'ready' && !g.shield) ? Math.sin(clock * 9) * 3 : 0;

    // villain peeks in beside the portal
    if (villain && ok(ART[villain.im])) {
      var vk = Math.min(1, (villain.t > 0.25 ? 1 : villain.t / 0.25)), vh = hS * 0.62;
      cx.globalAlpha = vk; sprite(ART[villain.im], Wd - vh * 0.42 + (1 - vk) * 60, py + vh * 0.75, vh); cx.globalAlpha = 1;
    }

    // the message flies out of the portal and grows as it nears — no colour
    // hint on it: it has to be read
    if (g.cur) {
      var m = g.cur, bw = Math.min(Wd - 28, 390), fs = Math.max(15, Math.min(19, Wd / 21));
      cx.font = '800 ' + fs + 'px "Nunito Sans","Segoe UI",system-ui,sans-serif';
      if (!m.lines) m.lines = wrap(m.text, bw - 66);
      var bh = 32 + m.lines.length * (fs + 6);
      var p = m.t / m.T, e = 1 - Math.pow(1 - Math.min(1, p * 2.4), 3);      // pops to full size early, so it is readable
      var k = 0.45 + 0.55 * e, endY = feet - hS - bh / 2 - 6;
      var mx = px + (sx - px) * e, my = py + (endY - py) * (0.25 * e + 0.75 * p);
      cx.save(); cx.translate(mx, my); cx.scale(k, k);
      cx.shadowColor = 'rgba(0,0,0,.45)'; cx.shadowBlur = 18; cx.shadowOffsetY = 6;
      cx.fillStyle = '#fff'; rr(-bw / 2, -bh / 2, bw, bh, 18); cx.fill();
      cx.shadowColor = 'transparent';
      cx.fillStyle = '#e9edf6'; cx.beginPath(); cx.arc(-bw / 2 + 27, 0, 14, 0, 7); cx.fill();
      cx.font = '15px system-ui'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText('✉️', -bw / 2 + 27, 1);
      cx.font = '800 ' + fs + 'px "Nunito Sans","Segoe UI",system-ui,sans-serif';
      cx.fillStyle = '#0d1b3e'; cx.textBaseline = 'top'; cx.textAlign = 'left';
      m.lines.forEach(function (ln, i) { cx.fillText(ln, -bw / 2 + 50, -bh / 2 + 16 + i * (fs + 6)); });
      cx.fillStyle = 'rgba(13,27,62,.12)'; rr(-bw / 2 + 14, bh / 2 - 9, bw - 28, 4, 2); cx.fill();
      cx.fillStyle = p > 0.75 ? '#e63946' : '#c9a84c'; rr(-bw / 2 + 14, bh / 2 - 9, (bw - 28) * (1 - p), 4, 2); cx.fill();
      cx.restore();
    }

    // Shieldy
    var which = g.shield && g.mode === 'play' ? 'shieldy-shield' : 'shieldy-' + pose;
    cx.fillStyle = 'rgba(0,0,0,.35)'; cx.beginPath(); cx.ellipse(sx, feet - 4, hS * 0.3, hS * 0.05, 0, 0, 7); cx.fill();
    sprite(ART[which] && ok(ART[which]) ? ART[which] : ART['shieldy-ready'], sx, feet + bob - (pose === 'cheer' ? Math.sin((0.5 - poseT) / 0.5 * Math.PI) * 26 : 0), hS);

    // particles
    for (var i = g.parts.length - 1; i >= 0; i--) { var q = g.parts[i]; q.t -= dt; if (q.t <= 0) { g.parts.splice(i, 1); continue; } q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 420 * dt; cx.globalAlpha = Math.min(1, q.t * 2); cx.fillStyle = q.c; cx.beginPath(); cx.arc(q.x, q.y, 3.5, 0, 7); cx.fill(); }
    cx.globalAlpha = 1;

    // HUD
    cx.textBaseline = 'top'; cx.textAlign = 'left'; cx.font = '900 24px system-ui';
    for (var h = 0; h < 3; h++) { cx.fillStyle = h < g.hearts ? '#ff5d6c' : 'rgba(255,255,255,.28)'; cx.fillText('♥', 14 + h * 26, 10); }
    var sc2 = String(g.score); cx.font = '900 20px "Nunito Sans",system-ui,sans-serif';
    var sw = cx.measureText(sc2).width + 26;
    cx.fillStyle = 'rgba(7,14,36,.6)'; rr(Wd - sw - 12, 9, sw, 32, 16); cx.fill();
    cx.fillStyle = '#e8c56a'; cx.textAlign = 'center'; cx.fillText(sc2, Wd - 12 - sw / 2, 15);
    if (g.combo >= 3) { cx.font = '900 14px "Nunito Sans",system-ui,sans-serif'; cx.fillStyle = '#8fe6e2'; cx.textAlign = 'right'; cx.fillText('×' + g.combo, Wd - 16, 46); }

    if (g.mode === 'play' && g.n <= 3 && !g.flash) {
      cx.textAlign = 'center'; cx.font = '900 14px "Nunito Sans",system-ui,sans-serif';
      var hw = cx.measureText(S.hold).width + 24;
      cx.fillStyle = 'rgba(7,14,36,.7)'; rr(sx - hw / 2, 58, hw, 28, 14); cx.fill();
      cx.fillStyle = '#fff'; cx.fillText(S.hold, sx, 65);
    }
    if (g.flash) {
      cx.textAlign = 'center'; cx.font = '900 30px "Nunito Sans",system-ui,sans-serif';
      cx.globalAlpha = Math.min(1, g.flash.t * 2.5);
      cx.lineWidth = 6; cx.strokeStyle = 'rgba(7,14,36,.85)'; cx.strokeText(g.flash.s, sx, Ht * 0.3);
      cx.fillStyle = g.flash.c; cx.fillText(g.flash.s, sx, Ht * 0.3); cx.globalAlpha = 1;
    }
    cx.restore();
  }

  var last = 0;
  function loop(ts) {
    var dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
    frame(dt); requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) up(); });
  window.addEventListener('resize', resize);
  resize(); requestAnimationFrame(loop);

  // Read-only view of the run, so the game can be driven end to end in a test.
  window.ShieldyDash = { state: function () { return { mode: g.mode, score: g.score, hearts: g.hearts, combo: g.combo, n: g.n, cur: g.cur ? { red: g.cur.red, lever: g.cur.lever || null, left: g.cur.T - g.cur.t } : null, missed: g.missed }; } };
})();
</script>
</body>
</html>
