<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Search and browse every past issue of the DSK Monthly Journal.">
<title>Journal Archive — Digital Safety Knights</title>
<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="assets/breadcrumb.css">
<script src="assets/knight-points.js"></script>
<style>
  :root { --navy: #0d1b3e; --navy2: #1a2f6e; --gold: #c9a84c; --gold2: #e8c56a; --light: #f4f6fb; --gray: #6c757d; --text: #2d3748; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--light); color: var(--text); }
  .topbar { background: var(--navy); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 20px rgba(0,0,0,0.3); }
  .topbar .brand { color: var(--gold); font-weight: 900; text-decoration: none; font-size: 1.05rem; }
  .topbar .home-link { color: #cdd6ea; text-decoration: none; font-size: 0.85rem; font-weight: 700; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 30px 18px 90px; }
  .hero { text-align: center; margin-bottom: 24px; }
  .hero .icon { font-size: 2.6rem; margin-bottom: 6px; }
  .hero h1 { color: var(--navy); font-size: 1.6rem; margin-bottom: 6px; }
  .hero p { color: var(--gray); font-size: 0.9rem; }

  .search-row { margin-bottom: 16px; }
  #j-search { width: 100%; padding: 14px 18px; border-radius: 14px; border: 2px solid #dfe4ee; font-size: 0.95rem; font-family: inherit; }
  #j-search:focus { outline: none; border-color: var(--gold); }

  .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 22px; }
  .filter-chip { background: white; border: 2px solid #dde2f0; color: var(--navy); padding: 7px 16px; border-radius: 20px; font-weight: 800; font-size: 0.8rem; cursor: pointer; }
  .filter-chip.active { border-color: var(--gold); background: rgba(201,168,76,0.1); }

  .j-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.1rem; }
  .j-card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 20px rgba(13,27,62,0.07); text-decoration: none; color: inherit; display: block; }
  .j-card:hover { transform: translateY(-3px); }
  .j-thumb { height: 110px; display: flex; align-items: center; justify-content: center; font-size: 2.8rem; }
  .j-body { padding: 16px 18px; }
  .j-tag { font-size: 0.66rem; font-weight: 900; color: var(--gold2); background: var(--navy); display: inline-block; padding: 3px 9px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .j-card h3 { font-size: 0.98rem; color: var(--navy); margin-bottom: 6px; line-height: 1.3; }
  .j-card p { font-size: 0.82rem; color: var(--gray); line-height: 1.5; margin-bottom: 8px; }
  .j-meta { font-size: 0.74rem; color: var(--gray); font-weight: 700; }
  .j-empty { text-align: center; color: var(--gray); padding: 50px 0; grid-column: 1 / -1; }
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="/">🛡️ Digital Safety Knights</a>
  <a class="home-link" href="/resources.html">📚 Resources</a>
</div>
<div class="dsk-breadcrumb"><a href="/">Home</a><span class="sep">/</span><a href="/resources.html">Resources</a><span class="sep">/</span><span class="current">Journal Archive</span></div>

<div class="wrap">
  <div class="hero">
    <div class="icon">📰</div>
    <h1>Journal Archive</h1>
    <p>Every issue of the DSK Monthly Journal, searchable and filterable by topic.</p>
  </div>

  <div class="search-row"><input id="j-search" type="text" placeholder="Search titles and topics… (e.g. 'roblox', 'ai', 'sextortion')"></div>
  <div class="filters" id="j-filters"></div>
  <div class="j-grid" id="j-grid"></div>
</div>

<script>
const ISSUES = [
  { tag: "Parent Toolkit", thumb: "🎒", bg: "#e8f4f2", title: "Back-to-School Digital Setup: The 30-Minute Family Tech Reset", desc: "A practical, once-a-year checklist to reset privacy settings, platform protections, and your family media agreement together.", meta: "August 2026 · 6 min read", file: "august-2026.pdf" },
  { tag: "Stranger Danger", thumb: "🎥", bg: "#fdeeee", title: "The Livestream Loophole: Random-Chat Apps After Omegle", desc: "Omegle shut down in 2023 — but instant random-video chat with strangers didn't disappear, it moved. Here's where.", meta: "July 2026 · 6 min read", file: "july-2026.pdf" },
  { tag: "Tech & Algorithms", thumb: "📱", bg: "#eef1fb", title: "How the Feed Is Built to Keep Them Scrolling", desc: "Infinite scroll, autoplay, and variable rewards, explained — and what actually helps beyond a screen-time limit.", meta: "June 2026 · 7 min read", file: "june-2026.pdf" },
  { tag: "Predator Tactics", thumb: "🔒", bg: "#fdeeee", title: "The Fastest-Growing Threat: Financial Sextortion of Teen Boys", desc: "How the scam works, why speed is the weapon, and exactly what to do if it's already happening.", meta: "May 2026 · 7 min read", file: "may-2026.pdf" },
  { tag: "AI Safety", thumb: "🤖", bg: "#eef1fb", title: "How Predators Use AI to Target Children in 2026", desc: "A deep-dive into the new wave of AI-powered grooming tactics and how families can defend against them today.", meta: "April 2026 · 8 min read", file: "april-2026.pdf" },
  { tag: "Gaming", thumb: "🎮", bg: "#eef8ec", title: "Inside Roblox: What Parents Don't See", desc: "An investigative look at hidden chat channels, user-generated games, and content your child may encounter.", meta: "March 2026 · 6 min read", file: "march-2026.pdf" },
  { tag: "Mental Health", thumb: "💜", bg: "#f4eefb", title: "The Emotional Impact of Online Harassment on Kids", desc: "Expert advice from child psychologists on recognizing cyberbullying trauma and supporting your child's recovery.", meta: "February 2026 · 10 min read", file: "february-2026.pdf" }
];

const grid = document.getElementById('j-grid');
const filtersEl = document.getElementById('j-filters');
const searchEl = document.getElementById('j-search');
let activeTag = 'all';

const tags = ['all', ...Array.from(new Set(ISSUES.map(i => i.tag)))];
filtersEl.innerHTML = tags.map(t => '<button type="button" class="filter-chip' + (t === 'all' ? ' active' : '') + '" data-tag="' + t + '">' + (t === 'all' ? '🌐 All Topics' : t) + '</button>').join('');
filtersEl.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    activeTag = chip.getAttribute('data-tag');
    filtersEl.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c === chip));
    renderGrid();
  });
});
searchEl.addEventListener('input', renderGrid);

function renderGrid() {
  const q = searchEl.value.trim().toLowerCase();
  const filtered = ISSUES.filter(i => {
    const matchesTag = activeTag === 'all' || i.tag === activeTag;
    const matchesQuery = !q || (i.title + ' ' + i.desc + ' ' + i.tag).toLowerCase().indexOf(q) !== -1;
    return matchesTag && matchesQuery;
  });
  if (!filtered.length) {
    grid.innerHTML = '<div class="j-empty">No issues match that search — try a different word or topic.</div>';
    return;
  }
  grid.innerHTML = filtered.map(i =>
    '<a class="j-card" href="https://digitalsafetyknights.org/journal/' + i.file + '" target="_blank" onclick="if(window.DSKPoints)DSKPoints.markComboActivity(\'guide\')">' +
      '<div class="j-thumb" style="background:' + i.bg + '">' + i.thumb + '</div>' +
      '<div class="j-body"><div class="j-tag">' + i.tag + '</div><h3>' + i.title + '</h3><p>' + i.desc + '</p><div class="j-meta">' + i.meta + ' · 📥 Download PDF</div></div>' +
    '</a>'
  ).join('');
}

renderGrid();
</script>
<script src="/assets/lang-switcher.js"></script>
<script src="/assets/site-search.js"></script>
<script src="/assets/play-now-fab.js"></script>
</body>
</html>
