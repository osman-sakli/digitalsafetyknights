function tone(freqs, dur, type, vol) {

    gn.gain.setValueAtTime(vol || 0.1, t0); gn.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(gn); gn.connect(ac.destination); o.start(t0); o.stop(t0 + dur);

}

   Every walker is one of the film's friends. Some are Glitch wearing that

function spawnWalker() {
  const lane = [-1, 0, 1][Math.floor(Math.random() * 3)];
  const who = FRIENDS[Math.floor(Math.random() * FRIENDS.length)];
  const fake = Math.random() < 0.5;
  const msg = fake ? nextRed() : { text: nextSafe() };
  const obj = M[who].clone();
  obj.position.set(lane * LANE + (Math.random() - 0.5) * 0.3, 0, SPAWN_Z);
  scene.add(obj);
  const sh = new THREE.Mesh(SHADOW_GEO, SHADOW_MAT); sh.rotation.x = -Math.PI / 2; sh.position.set(obj.position.x, 0.02, SPAWN_Z); scene.add(sh);
  const b = document.createElement('button'); b.type = 'button'; b.className = 'bub'; b.textContent = msg.text;
  const w = { obj, sh, lane, who, fake, lever: msg.lever, text: msg.text, state: 'walk', phase: Math.random() * 6, daze: 0, bub: b, id: Math.random() };
  b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); tossAt(w); });
  b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tossAt(w); } });
  $('bubbles').appendChild(b);

}
let SHADOW_GEO, SHADOW_MAT;

function removeWalker(w) {
  scene.remove(w.obj); scene.remove(w.sh); w.bub.remove();

}

function unmask(w) {   // the shield found Glitch

  settle(w, 'good'); SFX.unmask();
  flash(S.caught + ' +' + pts, '#8fe6e2', S.lever[w.lever]);

/* ───────────── the shield ───────────── */
function tossAt(w) {
  if (g.mode !== 'play' || !w || w.state !== 'walk') return;
  $('hint').hidden = true;
  if (flight.state !== 'ready') { flight.queue = w; return; }
  flight.state = 'out'; flight.t = 0; flight.target = w;
  flight.from.copy(shieldHome);
  const tp = w.obj.position;
  flight.dur = 0.22 + Math.min(0.4, Math.abs(tp.z) * 0.009);
  flight.ctrl.set((shieldHome.x + tp.x) / 2 + (tp.x >= 0 ? -2.2 : 2.2), 3.2, (shieldHome.z + tp.z) / 2);
  w.targeted = true; g.throwT = 0.25; SFX.toss();
}
function bez(out, a, c, b, t) {
  const u = 1 - t;
  out.set(u * u * a.x + 2 * u * t * c.x + t * t * b.x, u * u * a.y + 2 * u * t * c.y + t * t * b.y, u * u * a.z + 2 * u * t * c.z + t * t * b.z);
  return out;
}
const tmpV = new THREE.Vector3(), tgtV = new THREE.Vector3();
function updateShield(dt) {
  if (!shield) return;
  shield.children[0].rotation.y += dt * (flight.state === 'ready' ? 1.2 : 22);
  if (flight.state === 'ready') { shield.position.lerp(tmpV.copy(shieldHome).add(new THREE.Vector3(0, Math.sin(g.t * 3) * 0.05, 0)), Math.min(1, dt * 14)); return; }
  flight.t += dt / flight.dur;
  const w = flight.target;
  if (flight.state === 'out') {
    tgtV.copy(w.obj.position); tgtV.y += 1.0;
    bez(shield.position, flight.from, flight.ctrl, tgtV, Math.min(1, flight.t));
    if (!reduced && Math.random() < 0.7) burst(shield.position.x, shield.position.y, shield.position.z, 1, 0xffe08a, 0.22, 1, 0);
    if (flight.t >= 1) {
      if (w.state === 'walk') { if (w.fake) unmask(w); else { w.state = 'hitdone'; bonk(w); } }
      flight.state = 'back'; flight.t = 0; flight.from.copy(shield.position);
      flight.ctrl.set(flight.from.x * 0.5, 3.6, (flight.from.z + shieldHome.z) / 2);
    }
  } else {
    bez(shield.position, flight.from, flight.ctrl, shieldHome, Math.min(1, flight.t));
    if (flight.t >= 1) {
      flight.state = 'ready';
      const q = flight.queue; flight.queue = null;
      if (q && q.state === 'walk' && g.mode === 'play') tossAt(q);
    }
  }
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
$('c').addEventListener('pointerdown', e => {

  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);

    if (w.state !== 'walk') continue;
    const hit = ray.intersectObject(w.obj, true)[0];
    if (hit && hit.distance < bd) { bd = hit.distance; best = w; }

/* ───────────── run lifecycle ───────────── */

function nextWave() {

  g.speed = Math.min(7.5, 3.3 + (g.wave - 1) * 0.5);

    if (DSKPoints.markComboActivity) DSKPoints.markComboActivity('game');

/* ───────────── per frame ───────────── */
const proj = new THREE.Vector3();
function update(dt) {
  g.t += dt;
  const playing = g.mode === 'play';

  if (playing) {
    if (g.between > 0) { g.between -= dt; if (g.between <= 0) nextWave(); }
    else {
      g.sinceSpawn += g.speed * dt;
      if (g.waveLeft > 0 && g.sinceSpawn >= g.gap) { g.sinceSpawn = 0; spawnWalker(); }
      if (g.waveLeft <= 0 && !g.walkers.some(w => w.state === 'walk' || w.state === 'dazed') && g.mode === 'play') {
        if (!g.waveHurt) { g.score += 200; banner(S.perfect + ' +200'); fireworks(); SFX.wave(); }
        g.between = 1.8;
      }
    }
  }

  // walkers
  for (const w of g.walkers.slice()) {
    if (w.state === 'done') continue;
    const o = w.obj;
    let v = playing ? g.speed : 0;
    if (w.state === 'dazed') { w.daze -= dt; v *= 0.15; o.rotation.x = -0.35 * Math.max(0, w.daze); if (w.daze <= 0) { w.state = 'hitdone'; o.rotation.x = 0; } }
    o.position.z += v * dt;
    w.phase += dt * (v * 2.4 + 1);
    o.position.y = Math.abs(Math.sin(w.phase)) * 0.16;
    o.rotation.z = Math.sin(w.phase) * 0.1;
    w.sh.position.set(o.position.x, 0.02, o.position.z);
    if (playing && o.position.z >= GATE && (w.state === 'walk' || w.state === 'hitdone')) { arrive(w); if (g.mode !== 'play') break; }
  }

  // bubbles follow heads. Nearest first: a bubble that would overlap one
  // already placed is lifted above it, so a trick can never hide behind a
  // friend's message; one lifted under the top bar waits until it is closer.
  const H = innerHeight, Wd = innerWidth, topLimit = 62;
  const placed = [];
  const order = g.walkers.slice().sort((a, b) => b.obj.position.z - a.obj.position.z);
  for (const w of order) {
    const o = w.obj, z = o.position.z;
    proj.set(o.position.x, 2.05, o.position.z).project(camera);
    const vis = THREE.MathUtils.clamp((z + 37) / 5, 0, 1);
    const sc = THREE.MathUtils.clamp(0.74 + (z + 34) / 70, 0.74, 1);
    if (!w.bw) { w.bw = w.bub.offsetWidth || 160; w.bh = w.bub.offsetHeight || 40; }
    const bw = w.bw * sc, bh = w.bh * sc + 8;
    const sx = (proj.x * 0.5 + 0.5) * Wd;
    let sy = (-proj.y * 0.5 + 0.5) * H;
    if (w.state !== 'done') {
      for (let pass = 0; pass < 6; pass++) {
        let moved = false;
        for (const r of placed) {
          if (sx - bw / 2 < r.r && sx + bw / 2 > r.l && sy - bh < r.b && sy > r.t) { sy = r.t - 3; moved = true; }
        }
        if (!moved) break;
      }
      placed.push({ l: sx - bw / 2, r: sx + bw / 2, t: sy - bh, b: sy });
    }
    const room = sy - bh > topLimit;
    w.bub.style.transform = `translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) translate(-50%,-100%) scale(${sc.toFixed(3)})`;
    if (w.state !== 'done') w.bub.style.opacity = room ? vis : 0;
    w.bub.style.pointerEvents = room && vis > 0.3 && w.state === 'walk' ? 'auto' : 'none';
    w.bub.style.zIndex = String(200 + Math.round(z * 2));
    w.bub.style.visibility = vis > 0.02 ? 'visible' : 'hidden';
  }

  // fliers: unmasked Glitches fly off, Glitch sneaking in, friends walking in
  for (let i = fliers.length - 1; i >= 0; i--) {
    const f = fliers[i]; f.t += dt; const o = f.obj;
    if (f.kind === 'away') {
      // knocked out of the disguise: pops, then is launched up and over the
      // camera, spinning and growing, so the best moment is the biggest one
      const pop = Math.min(1, f.t / 0.15);
      if (f.t < 0.3) { o.scale.setScalar(0.5 + 0.9 * pop); o.position.y = Math.sin(pop * Math.PI) * 0.4; }
      else {
        const k = f.t - 0.3;
        o.position.y = 0.4 + 11 * k - 4.5 * k * k; o.position.z += dt * (f.vz || 0); o.position.x += f.vx * dt;
        o.rotation.y += dt * 11; o.rotation.z += dt * 4; o.scale.setScalar(1.4 + k * 0.9);
        if (!reduced && Math.random() < 0.5) burst(o.position.x, o.position.y + 0.8, o.position.z, 1, 0xc18bff, 0.3, 1, 0);
      }
      if (f.t > 1.9 || o.position.z > 9) { scene.remove(o); fliers.splice(i, 1); }
    } else if (f.kind === 'sneak') {
      o.scale.setScalar(Math.min(1, 0.4 + f.t * 4));
      if (f.t < 0.9) { o.position.y = Math.abs(Math.sin(f.t * 14)) * 0.35; o.rotation.y = Math.sin(f.t * 10) * 0.4; }
      else { o.position.z += dt * 7; o.position.x += f.vx * dt; o.rotation.y = Math.PI; o.position.y = Math.abs(Math.sin(f.t * 16)) * 0.25; }
      if (f.t > 2.4) { scene.remove(o); fliers.splice(i, 1); }
    } else {
      o.position.z += dt * 3.2; o.position.x += f.vx * dt * (f.t < 1.2 ? 1 : 0);
      o.position.y = Math.abs(Math.sin(f.t * 9)) * 0.14; o.rotation.y = -Math.sign(f.vx) * 0.6;
      if (f.sh) f.sh.position.set(o.position.x, 0.02, o.position.z);
      if (f.t > 1.2 && f.t < 1.6) o.rotation.z = Math.sin(f.t * 30) * 0.15;   // a little wave
      if (f.t > 2.2) { scene.remove(o); if (f.sh) scene.remove(f.sh); fliers.splice(i, 1); }
    }
  }

  // Shieldy: idle bob, a lunge when he throws
  if (shieldy) {
    g.throwT = Math.max(0, g.throwT - dt);
    const l = g.throwT > 0 ? Math.sin((0.25 - g.throwT) / 0.25 * Math.PI) : 0;
    shieldy.position.set(0, Math.abs(Math.sin(g.t * 2.2)) * 0.03, 1.2 - l * 0.35);
    shieldy.rotation.x = l * 0.25; shieldy.rotation.y = (flight.target && flight.state === 'out' ? -flight.target.obj.position.x * 0.06 : 0) - l * 0.3;
  }
  // Sprout on the wall bounces when something goes right
  if (sprout) {
    g.cheer = Math.max(0, g.cheer - dt * 1.2);
    sprout.position.y = 0.93 + Math.abs(Math.sin(g.t * 14)) * 0.45 * g.cheer;
    sprout.rotation.z = Math.sin(g.t * 9) * 0.12 * g.cheer;
  }
  updateShield(dt);
  gateLine.material.opacity = 0.4 + Math.sin(g.t * 3) * 0.15;

  for (const p of sparks) {
    if (p.t <= 0) continue;
    p.t -= dt; p.v.y -= p.grav * dt; p.s.position.addScaledVector(p.v, dt);
    p.s.material.opacity = Math.min(1, p.t * 2); if (p.t <= 0) p.s.visible = false;
  }

  const portrait = camera.aspect < 1;
  camera.position.set(0, portrait ? 5.6 : 4.4, portrait ? 9.2 : 7.6);
  if (g.shake > 0) { g.shake -= dt; camera.position.x += (Math.random() - 0.5) * 0.3; camera.position.y += (Math.random() - 0.5) * 0.3; }
  camera.lookAt(0, 0.9, -12);

  if (flashTimer > 0) { flashTimer -= dt; if (flashTimer <= 0) $('flash').style.opacity = 0; }
  if (bannerTimer > 0) { bannerTimer -= dt; if (bannerTimer <= 0) $('banner').classList.remove('on'); }
  if (playing) hud();
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 70 : 56; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

manager.onLoad = () => {
  if (loadFailed || FRIENDS.concat(['shieldy', 'glitch', 'shield', 'sprout', 'crate', 'lantern', 'tower']).some(n => !M[n])) { $('t-load').textContent = S.loadErr; return; }
  SHADOW_GEO = new THREE.CircleGeometry(0.55, 24);
  SHADOW_MAT = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3, depthWrite: false });
  M.shieldy.rotation.y = Math.PI; shieldy = new THREE.Group(); shieldy.add(M.shieldy); scene.add(shieldy);
  const ssh = new THREE.Mesh(SHADOW_GEO, SHADOW_MAT); ssh.rotation.x = -Math.PI / 2; ssh.position.set(0, 0.02, 1.2); ssh.scale.setScalar(1.2); scene.add(ssh);
  // the shield lies almost flat and spins like a disc; the tilt keeps its bolt visible
  shield = new THREE.Group(); M.shield.rotation.x = -1.15; const spin = new THREE.Group(); spin.add(M.shield); shield.add(spin);
  shield.position.copy(shieldHome); scene.add(shield);
  // Sprout watches from a crate by the road, close enough to stay in a phone's view
  const seat = M.crate; seat.position.set(-4.6, 0, -9); seat.rotation.y = 0.3; scene.add(seat);
  sprout = M.sprout; sprout.rotation.y = 0.75; sprout.position.set(-4.6, 0.93, -9); scene.add(sprout);
  for (let i = 0; i < 12; i++) {
    const o = M.lantern.clone(); o.position.set((i % 2 ? 1 : -1) * (ROAD_W / 2 + 0.75), 0, 2 - Math.floor(i / 2) * 9.5);
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.9 }));
    halo.scale.set(2.2, 2.2, 1); halo.position.y = 3.0; o.add(halo); scene.add(o);
  }
  for (let i = 0; i < 8; i++) {
    const o = M.tower.clone(), s = 6.5 + Math.random() * 4;
    o.scale.setScalar(s); o.rotation.y = Math.random() * 6.28;
    o.position.set((i % 2 ? 1 : -1) * (13 + Math.random() * 4), 0, -4 - Math.floor(i / 2) * 15); scene.add(o);
  }
  { const o = M.tower.clone(); o.scale.setScalar(16); o.position.set(0, 0, -70); scene.add(o); }   // the far keep
  $('ov-load').hidden = true; $('ov-title').hidden = false; $('b-start').focus();
  g.mode = 'title';
};

let last = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!document.hidden) { update(dt); renderer.render(scene, camera); }
});

// Read-only view plus the player's own inputs, so a test can drive a round.
window.ShieldToss = {
  state: () => ({ mode: g.mode, t: g.t, score: g.score, hearts: g.hearts, wave: g.wave, combo: g.combo, missed: g.missed, friendsHit: g.friendsHit, shield: flight.state,
    walkers: g.walkers.filter(w => w.state === 'walk').map(w => ({ id: w.id, lane: w.lane, z: w.obj.position.z, fake: w.fake, who: w.who, targeted: !!w.targeted })) }),
  tossId: id => tossAt(g.walkers.find(w => w.id === id)),
  step: dt => update(dt), render: () => renderer.render(scene, camera),
  info: () => ({ calls: renderer.info.render.calls, triangles: renderer.info.render.triangles })
};
</script>
